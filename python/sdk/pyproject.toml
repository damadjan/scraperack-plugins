[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scraperack-python"
version = "0.3.0a1"
description = "Warm Python environments on a self-hosted Scraperack cluster: run functions in pre-imported, snapshotted microVMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scraperack>=0.4.0a1", "cloudpickle>=3.1,<3.2"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]

[project.urls]
Repository = "https://github.com/damadjan/scraperack-plugins"
Issues = "https://github.com/damadjan/scraperack-plugins/issues"

[tool.setuptools]
packages = ["scraperack_python"]

[tool.setuptools.package-data]
scraperack_python = ["py.typed"]
